plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.myapp'

    // compileSdk: highest API you build against — use the latest stable
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myapp"

        // minSdk 24 (Android 7.0, 2016) covers ~98% of active devices.
        // Lower it (e.g. 21) for max reach, or raise it if you need newer-only APIs.
        minSdk 24

        // targetSdk should track the latest Play Store requirement.
        targetSdk 34

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Build a single APK per ABI instead of one fat APK, if desired:
        // ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }

    // Fixed debug key so every GitHub build is signed the same way and can
    // update over the installed app. Debug-only: never use for Play Store.
    signingConfigs {
        debug {
            storeFile file('debug-shared.p12')
            storePassword 'android'
            keyAlias 'myappdebug'
            keyPassword 'android'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
